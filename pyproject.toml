[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dreamer-tools"
version = "0.3.0"
description = "Inspect and describe trained DreamerV3 world-model runs"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [{name = "dreamer-tools contributors"}]
keywords = ["dreamerv3", "world-models", "reinforcement-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
]
media = [
  "imageio>=2.36,<3",
  "imageio-ffmpeg>=0.5,<1",
  "numpy>=1.26,<3",
]

[project.scripts]
dreamer = "dreamer_tools.cli:main"

[project.urls]
Repository = "https://github.com/koerner/dreamer-tools"
Upstream = "https://github.com/danijar/dreamerv3"

[tool.hatch.build.targets.wheel]
packages = ["src/dreamer_tools"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dreamer_tools"]

[tool.pytest.ini_options]
addopts = "--cov=dreamer_tools --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
